<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <!-- SCL banner — reemplaza SCL — Bots &amp; automatización y la versión según cada repo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="56" rx="16" fill="url(#acc)" opacity="0.15"/>
  <rect x="24" y="88" width="6" height="104" rx="3" fill="url(#acc)"/>

  <!-- Nombre del repo -->
  <text x="56" y="126" font-family="JetBrains Mono, Consolas, monospace" font-size="48" font-weight="bold" fill="#e6edf3">NOMBRE-REPO</text>
  <text x="56" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#8b949e">Servidores de juego Pterodactyl · bot Telegram · vigía DNS · nftables</text>

  <!-- Firma estilo terminal -->
  <text x="56" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#3fb950">$</text>
  <text x="72" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#58a6ff">scl_san_enrique</text>
  <text x="248" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#8b949e">· christian nilo · v1.0.0</text>

  <!-- Cursor -->
  <rect x="430" y="204" width="12" height="22" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Decoración esquina: puntos estilo terminal -->
  <circle cx="1140" cy="40" r="7" fill="#ff5f57"/>
  <circle cx="1160" cy="40" r="7" fill="#febc2e"/>
  <circle cx="1180" cy="40" r="7" fill="#28c840"/>
</svg>
